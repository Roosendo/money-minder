@let style = "width: " + calculateProgress(saving()) + "%";
<div class="border-t border-rule py-4">
  <h3 class="text-lg">{{ saving().name }}</h3>
  <dl class="mt-2 grid grid-cols-2 gap-x-4 text-sm">
    <div>
      <dt class="text-muted">Monto objetivo</dt>
      <dd class="num text-ink">{{ saving().target_amount | currency: "USD" : "symbol" }}</dd>
    </div>
    <div>
      <dt class="text-muted">Monto actual</dt>
      <dd class="num text-ink">{{ saving().current_amount | currency: "USD" : "symbol" }}</dd>
    </div>
  </dl>
  <div class="mt-3 h-1 w-full bg-paper-3">
    <div class="h-1 bg-accent" [style]="style"></div>
  </div>
  <ng-content />
</div>
