<div class="flex items-start justify-between gap-4 border-t border-rule py-4">
  <div class="min-w-0">
    <h3 class="text-lg">{{ title() }}</h3>
    @if (amount() !== null) {
      <p class="num mt-1 text-ink">{{ amount() | currency: "USD" : "symbol" }}</p>
    }
    <p class="mt-2 text-sm text-muted">
      {{ dueAt() | date: "d/MM/y 'a las' hh:mm a" }} · {{ recurrenceLabel(recurrence()) }} ·
      {{ statusLabel(status()) }}
    </p>
  </div>
  <ng-content />
</div>
