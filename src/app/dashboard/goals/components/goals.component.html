@if (isLogged()) {
  <main class="container py-10">
    <header class="border-b border-rule pb-6">
      <h1 class="text-4xl">Objetivos de ahorro</h1>
      <p class="lead mt-3 max-w-[48ch] text-ink-2">
        Define una meta, registra lo que llevas y mira el avance en la misma hoja.
      </p>
    </header>

    <form
      (submit)="onNewSavingSubmit()"
      class="mx-auto mt-8 max-w-md border-t-2 border-rule-2 pt-6"
    >
      <h2 class="mb-4 text-xl">Agregar nuevo objetivo</h2>
      <div class="mb-4">
        <label for="goal-name" class="mb-2 block">Nombre del objetivo</label>
        <input
          [(ngModel)]="formData.name"
          name="name"
          type="text"
          id="goal-name"
          class="w-full"
          placeholder="PlayStation 5"
          required
        />
      </div>
      <div class="mb-4">
        <label for="target-amount" class="mb-2 block">Monto objetivo</label>
        <input
          [(ngModel)]="formData.targetAmount"
          name="targetAmount"
          type="number"
          id="target-amount"
          class="w-full"
          placeholder="3.99"
          required
          step="0.01"
        />
      </div>
      <div class="mb-4">
        <label for="current-amount" class="mb-2 block">Monto actual (por defecto $0)</label>
        <input
          [(ngModel)]="formData.currentAmount"
          name="currentAmount"
          type="number"
          id="current-amount"
          class="w-full"
          placeholder="3.99"
          step="0.01"
        />
      </div>
      <div class="mb-4">
        <label for="target-date" class="mb-2 block">Fecha objetivo</label>
        <input
          [(ngModel)]="formData.targetDate"
          name="targetDate"
          type="date"
          id="target-date"
          class="w-full"
        />
      </div>
      <app-submit-bttn [text]="'Agregar objetivo'" />
    </form>

    @if (savings().length) {
      <div id="savings-list" class="mx-auto my-8 max-w-lg space-y-4">
        @for (saving of savings(); track saving.id) {
          <app-savings-card [saving]="saving">
            <div class="mt-3 flex gap-3">
              <button type="button" (click)="openEditModal(saving)" class="btn btn--quiet">
                Editar
              </button>
              <button type="button" (click)="openDeleteModal(saving)" class="btn btn--quiet">
                Eliminar
              </button>
            </div>
          </app-savings-card>
        }
        @if (isModalEditOpen()) {
          <app-goal-modal-edit
            [goal]="selectedSaving!"
            (closeModal)="closeEditModal()"
            (save)="editSaving($event)"
          />
        }
        @if (isModalDeleteOpen()) {
          <app-goal-modal-delete
            [saving]="selectedSaving!"
            (closeModal)="closeDeleteModal()"
            (delete)="deleteSaving($event)"
          />
        }
      </div>
    }
  </main>
} @else {
  <app-not-logged />
}
