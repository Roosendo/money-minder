<form (submit)="onDelete()" class="overlay fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="sheet w-full max-w-lg p-6">
    <h2 class="text-xl">¿Eliminar el objetivo de ahorro {{ saving().name }}?</h2>
    <p class="mt-2 text-ink-2">Esta acción no se puede deshacer.</p>
    <div class="mt-6 flex flex-wrap gap-3">
      <button type="submit" class="btn btn--danger">Eliminar</button>
      <button type="button" (click)="onCloseModal()" class="btn btn--quiet">Cancelar</button>
    </div>
  </div>
</form>
