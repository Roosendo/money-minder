<form (submit)="onSave()" class="overlay fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="sheet w-full max-w-lg p-6">
    <h2 class="mb-4 text-xl">Editar objetivo de ahorro</h2>
    <div class="mb-4">
      <label for="edit-goal-name" class="mb-2 block">Nombre actual</label>
      <input
        [(ngModel)]="formEdit.newSavingName"
        name="name"
        type="text"
        id="edit-goal-name"
        class="w-full"
        placeholder="PlayStation 5"
        required
      />
    </div>
    <div class="mb-4">
      <label for="edit-target-amount" class="mb-2 block">Monto objetivo actual</label>
      <input
        [(ngModel)]="formEdit.newTarget"
        name="target_amount"
        type="number"
        id="edit-target-amount"
        class="w-full"
        step="0.01"
      />
    </div>
    <div class="mb-4">
      <label for="edit-current-amount" class="mb-2 block">Monto actual</label>
      <input
        [(ngModel)]="formEdit.newCurrentAmount"
        name="current_amount"
        type="number"
        id="edit-current-amount"
        class="w-full"
        step="0.01"
      />
    </div>
    <div class="mb-4">
      <label for="edit-end-date" class="mb-2 block">Fecha de fin</label>
      <input
        [(ngModel)]="formEdit.newEndDate"
        name="end_date"
        type="date"
        id="edit-end-date"
        class="w-full"
        required
      />
    </div>
    <div class="mt-6 flex flex-wrap gap-3">
      <button type="submit" class="btn btn--primary">Guardar cambios</button>
      <button type="button" (click)="onCloseModal()" class="btn btn--quiet">Cancelar</button>
    </div>
  </div>
</form>
