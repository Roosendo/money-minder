<form (submit)="onSave()" class="overlay fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="sheet w-full max-w-lg p-6">
    <h2 class="mb-4 text-xl">Editar recordatorio</h2>
    <div class="mb-4">
      <label for="edit-title" class="mb-2 block">Título actual</label>
      <input
        [(ngModel)]="reminderEdit.newTitle"
        name="title"
        type="text"
        id="edit-title"
        class="w-full"
        placeholder="Título del recordatorio"
        required
      />
    </div>
    <div class="mb-4">
      <label for="edit-description" class="mb-2 block">Descripción actual</label>
      <input
        [(ngModel)]="reminderEdit.newDescription"
        name="description"
        type="text"
        id="edit-description"
        class="w-full"
      />
    </div>
    <div class="mb-4">
      <label for="edit-reminder-date" class="mb-2 block">Fecha del recordatorio</label>
      <input
        [(ngModel)]="reminderEdit.newDate"
        name="reminderDate"
        type="datetime-local"
        id="edit-reminder-date"
        class="w-full"
      />
    </div>
    <div class="mt-6 flex flex-wrap gap-3">
      <button type="submit" class="btn btn--primary">Guardar cambios</button>
      <button type="button" (click)="onCloseModal()" class="btn btn--quiet">Cancelar</button>
    </div>
  </div>
</form>
