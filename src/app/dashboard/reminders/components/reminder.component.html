@if (isLogged()) {
  <main class="container py-10">
    <header class="border-b border-rule pb-6">
      <h1 class="text-4xl">Recordatorios</h1>
      <p class="lead mt-3 max-w-[48ch] text-ink-2">
        Anota los pagos y vencimientos que no quieres dejar pasar.
      </p>
    </header>

    <form
      (submit)="onNewReminderSubmit()"
      id="reminder-form"
      class="mx-auto mt-8 max-w-lg space-y-4 border-t-2 border-rule-2 pt-6"
    >
      <h2 class="text-xl">Agregar nuevo recordatorio</h2>
      <div>
        <label for="reminder-title" class="mb-2 block">Título del recordatorio</label>
        <input
          [(ngModel)]="formReminder.title"
          name="title"
          type="text"
          id="reminder-title"
          placeholder="Título del recordatorio"
          required
          class="w-full"
        />
      </div>
      <div>
        <label for="reminder-amount" class="mb-2 block">Monto (opcional)</label>
        <input
          [(ngModel)]="formReminder.amount"
          name="amount"
          type="number"
          id="reminder-amount"
          placeholder="3.99"
          step="0.01"
          min="0"
          class="w-full"
        />
      </div>
      <div>
        <label for="reminder-date" class="mb-2 block">Fecha y hora</label>
        <input
          [(ngModel)]="formReminder.dueAt"
          name="dueAt"
          type="datetime-local"
          id="reminder-date"
          required
          class="w-full"
        />
      </div>
      <div>
        <label for="reminder-recurrence" class="mb-2 block">Repetición</label>
        <select
          [(ngModel)]="formReminder.recurrence"
          name="recurrence"
          id="reminder-recurrence"
          class="w-full"
        >
          <option value="none">Una sola vez</option>
          <option value="monthly">Mensual</option>
          <option value="yearly">Anual</option>
        </select>
      </div>
      <app-submit-bttn [text]="'Agregar recordatorio'" />
    </form>

    @if (reminders().length) {
      <div id="reminders-list" class="mx-auto mt-8 max-w-lg space-y-4">
        @for (reminder of reminders(); track reminder.id) {
          <app-reminders-card
            [title]="reminder.title"
            [amount]="reminder.amount"
            [dueAt]="reminder.due_at"
            [recurrence]="reminder.recurrence"
            [status]="reminder.status"
          >
            <div class="flex shrink-0 flex-col gap-2">
              <button type="button" (click)="openReminderEdit(reminder)" class="btn btn--quiet">
                Editar
              </button>
              <button type="button" (click)="openReminderDelete(reminder)" class="btn btn--quiet">
                Eliminar
              </button>
            </div>
          </app-reminders-card>
        }
        @if (isReminderEditOpen()) {
          <app-reminder-edit
            [reminder]="selectedReminder!"
            (closeModal)="onCloseModal()"
            (save)="onSave($event)"
          />
        }
        @if (isReminderDeleteOpen()) {
          <app-reminder-delete
            [reminder]="selectedReminder!"
            (close)="closeReminderDelete()"
            (delete)="onDelete($event)"
          />
        }
      </div>
    }
  </main>
} @else {
  <app-not-logged />
}
