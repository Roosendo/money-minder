<main class="container py-10">
  <header class="border-b border-rule pb-8">
    <h1 class="max-w-[20ch] text-4xl">Bienvenido a Money Minder</h1>
    <p class="lead mt-4 max-w-[52ch] text-ink-2">
      Explora las opciones disponibles para personalizar tu experiencia y aprovechar al máximo
      nuestros servicios.
    </p>
  </header>

  <div class="mt-10 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
    @if (isAuth()) {
      <app-financial-summary class="col-span-1 md:col-span-3" />

      <app-recent-transactions class="col-span-1 md:col-span-2" />

      <app-cash-flow class="col-span-1 md:col-span-2 lg:col-span-3" />

      <app-main-categories class="col-span-1 md:col-span-2 lg:col-span-3" />

      <app-goal />

      <app-reminders />
    }

    <app-quote />
  </div>
</main>
