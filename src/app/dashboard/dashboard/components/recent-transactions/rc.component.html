@if (recentTransactions().length) {
  <div class="sheet sheet--pad">
    <h2 class="text-xl">Transacciones recientes</h2>
    <div class="mt-4 overflow-x-auto">
      <table>
        <thead>
          <tr>
            <th class="py-2">Fecha</th>
            <th class="py-2">Categoría</th>
            <th class="py-2 text-right">Monto</th>
          </tr>
        </thead>
        <tbody>
          @for (rc of recentTransactions(); track $index) {
            <tr>
              <th scope="row" class="num py-3 text-left font-normal">
                {{ rc.date | date: "d/MM/y" }}
              </th>
              <td class="py-3">{{ rc.category }}</td>
              <td class="num py-3 text-right">
                {{ rc.amount | currency: "USD" : "symbol" }}
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
