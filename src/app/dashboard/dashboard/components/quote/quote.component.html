@if (quote()) {
  <figure class="border-t-2 border-rule-2 py-6">
    <blockquote class="max-w-[52ch] font-sans text-2xl leading-tight text-ink">
      “{{ quote().phrase }}”
    </blockquote>
    <figcaption class="mt-3 text-sm text-muted">
      {{ quote().character }} en {{ quote().movie }}
    </figcaption>
  </figure>
}
