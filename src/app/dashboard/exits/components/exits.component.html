@if (isLogged) {
  <main class="container py-10">
    <header class="border-b border-rule pb-6">
      <h1 class="text-4xl">Gastos</h1>
      <p class="lead mt-3 max-w-[48ch] text-ink-2">
        Registra cada salida de dinero y revisa el historial completo del mes.
      </p>
    </header>
    <app-form [type]="'exits'" (formSubmitted)="onFormSubmitted()" />
    <app-table [type]="'exits'" />
  </main>
} @else {
  <app-not-logged />
}
