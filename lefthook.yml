pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,html,css}"
      run: pnpm exec oxlint {staged_files}
    format:
      glob: "*.{js,ts,html,json,css,md}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
